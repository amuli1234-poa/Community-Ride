<!DOCTYPE html>
<html>
<head>
    <title>Leaflet OpenStreetMap</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; }
        #mapid { width: 100vw; height: 100vh; background: #f0f0f0; }

        .custom-marker-icon {
            background-color: #0E1325;
            border-radius: 50%;
            border: 2px solid #00E5FF;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .marker-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .ride-tooltip {
            background-color: #0E1325;
            border: 1px solid #00E5FF;
            color: #E8EEFF;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            white-space: nowrap;
            text-align: center;
        }

        .ride-tooltip.tooltip-paid {
            background-color: #FF3B47;
            border-color: #FF3B47;
            color: #FFFFFF;
        }
        .ride-tooltip.tooltip-paid:before { border-top-color: #FF3B47; }

        .ride-tooltip.tooltip-free {
            background-color: #00FFA3;
            border-color: #00FFA3;
            color: #050811;
        }
        .ride-tooltip.tooltip-free:before { border-top-color: #00FFA3; }

        .ride-tooltip.tooltip-pending {
            background-color: #FFBB00;
            border-color: #FFBB00;
            color: #050811;
        }
        .ride-tooltip.tooltip-pending:before { border-top-color: #FFBB00; }

        .leaflet-tooltip-top:before {
            border-top-color: #00E5FF;
        }

        /* Pulse animation for markers */
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(0, 229, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 71, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 71, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 71, 0); }
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 163, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 163, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 163, 0); }
        }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(255, 187, 0, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(255, 187, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 187, 0, 0); }
        }

        .pulse-cyan { animation: pulse-cyan 2s infinite; }
        .pulse-red { animation: pulse-red 2s infinite; }
        .pulse-green { animation: pulse-green 2s infinite; }
        .pulse-yellow { animation: pulse-yellow 2s infinite; }

        .custom-marker-icon.blue-dot {
            border-color: #00E5FF;
            background-color: #00E5FF;
            width: 14px;
            height: 14px;
            box-shadow: 0 0 15px #00E5FF;
        }
    </style>
</head>
<body>
<div id="mapid"></div>
<script>
    console.log("Map script initializing...");
    var mymap = L.map("mapid", { zoomControl: false }).setView([-1.286389, 36.817223], 12);

    // Standard OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(mymap);

    var icons = {
        green: '<i class="fa-solid fa-car"></i>',
        red: '<i class="fa-solid fa-car"></i>',
        yellow: '<i class="fa-solid fa-clock"></i>',
        blue: L.divIcon({ className: "custom-marker-icon blue-dot", iconSize: [14, 14], iconAnchor: [7, 7] })
    };

    var rideMarkers = {};
    console.log("Leaflet initialized. Map object:", mymap);

function addOrUpdateRideMarker(id, riderId, name, seats, phone, lat, lng, status, destination, pickup, departureTime, departureDate, avatarUrl, markerColor) {
    console.log("addOrUpdateRideMarker called for id:", id, "at:", lat, lng);

    if (!lat || !lng || lat === 0 || lng === 0) {
        console.warn("Invalid coordinates for ride:", id);
        return;
    }

    var iconColorClass = "pulse-cyan";
    var tooltipStatusClass = "tooltip-cyan";

    var s = status.toLowerCase();
    if (s === "paid") {
        iconColorClass = "pulse-red";
        tooltipStatusClass = "tooltip-paid";
    } else if (s === "free") {
        iconColorClass = "pulse-green";
        tooltipStatusClass = "tooltip-free";
    } else if (s === "pending") {
        iconColorClass = "pulse-yellow";
        tooltipStatusClass = "tooltip-pending";
    }

    var htmlContent = '<i class="fa-solid fa-car"></i>';
    if (avatarUrl && avatarUrl !== "") {
        htmlContent = '<img src="' + avatarUrl + '" class="marker-avatar" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'<i class=\\\'fa-solid fa-car\\\'></i>\';" />';
    }

    var icon = L.divIcon({
        className: "custom-marker-icon " + iconColorClass,
        html: htmlContent,
        iconSize: [36, 36],
        iconAnchor: [18, 36]
    });

    var labelContent = `<div style="line-height: 1.2;">${name}<br><span style="font-size: 0.85em; opacity: 0.9; font-weight: 500;">→ ${destination}</span></div>`;

    if (rideMarkers[id]) {
        rideMarkers[id].setLatLng([lat, lng]);
        rideMarkers[id].setIcon(icon);
        rideMarkers[id].setTooltipContent(labelContent);
        // Update tooltip class if status changed
        if (rideMarkers[id].getTooltip()) {
            var tooltip = rideMarkers[id].getTooltip();
            L.DomUtil.removeClass(tooltip._container, 'tooltip-paid tooltip-free tooltip-pending');
            L.DomUtil.addClass(tooltip._container, tooltipStatusClass);
        }
        rideMarkers[id].departureTime = departureTime;
        rideMarkers[id].departureDate = departureDate;
    } else {
        var marker = L.marker([lat, lng], { icon: icon }).addTo(mymap);
        marker.departureTime = departureTime;
        marker.departureDate = departureDate;

        marker.bindTooltip(labelContent, {
            permanent: true,
            direction: 'top',
            offset: [0, -35],
            className: 'ride-tooltip ' + tooltipStatusClass
        });

        marker.on('click', function() {
            if (window.Android) window.Android.onMarkerClick(id, riderId, name, seats, phone, lat, lng, status);
        });

        rideMarkers[id] = marker;
    }
}

    function fitAllMarkers() {
        var group = new L.featureGroup(Object.values(rideMarkers));
        if (group.getLayers().length > 0) {
            mymap.fitBounds(group.getBounds().pad(0.1));
        }
    }

    function removeRideMarker(id) {
        if (rideMarkers[id]) {
            mymap.removeLayer(rideMarkers[id]);
            delete rideMarkers[id];
        }
    }

    function checkExpiredRides() {
        var now = new Date();

        for (var id in rideMarkers) {
            var depTime = rideMarkers[id].departureTime;
            var depDate = rideMarkers[id].departureDate;

            if (depTime && depTime !== "N/A" && depTime !== "" && depDate && depDate !== "N/A" && depDate !== "") {
                var rideDateTime = new Date(depDate + "T" + depTime + ":00");
                if (now > rideDateTime) {
                    console.log("Removing expired ride: " + id + " scheduled for " + rideDateTime);
                    removeRideMarker(id);
                }
            }
        }
    }
    setInterval(checkExpiredRides, 30000); // Check every 30 seconds

    // Geolocation
    mymap.on("locationfound", function(e) {
        L.marker(e.latlng, {icon: icons.blue}).addTo(mymap);
        if (!window.initialLocationFound) {
            mymap.setView(e.latlng, 13);
            window.initialLocationFound = true;
        }
        if (window.Android) window.Android.onLocationUpdate(e.latlng.lat, e.latlng.lng);
    });
    mymap.locate({setView: true, watch: false});
</script>
</body>
</html>
